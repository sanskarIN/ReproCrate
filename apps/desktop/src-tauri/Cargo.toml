[package]
name = "reprocrate-desktop"
version = "0.6.0"
authors = ["Sanskar"]
edition = "2021"
license = "EPL-2.0"
publish = false
rust-version = "1.90"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reprocrate-core = { path = "../../../crates/reprocrate-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
