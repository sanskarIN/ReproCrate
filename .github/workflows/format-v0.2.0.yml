name: One-shot Rust formatting for v0.2.0

on:
  push:
    branches: [feat/v0.2.0-log-analysis]
    paths: [.format/v0.2.0]

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'sanskarIN/ReproCrate'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/v0.2.0-log-analysis
      - name: Format using pinned current stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
      - name: Commit only formatting changes
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add crates/reprocrate-core/src crates/reprocrate-cli/src crates/reprocrate-cli/tests
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): apply rustfmt to v0.2.0 log analyzer"
            git push origin HEAD:feat/v0.2.0-log-analysis
          fi
