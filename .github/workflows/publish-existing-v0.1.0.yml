name: Finalize validated v0.1.0 draft

on:
  push:
    branches: [main]
    paths: [".release/publish-v0.1.0"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify six uploaded release assets before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh release view v0.1.0 --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          test "$state" = "true"
          names="$(gh release view v0.1.0 --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          echo "$names"
          for platform in linux windows macos; do
            archive="$(printf '%s\n' "$names" | grep -E "^reprocrate-v0\.1\.0-${platform}-.+\.(zip|tar\.gz)$" | head -n 1)"
            test -n "$archive"
            printf '%s\n' "$names" | grep -Fx -- "$archive.sha256"
          done
          count="$(printf '%s\n' "$names" | grep -Ec '^reprocrate-v0\.1\.0-.*\.(zip|tar\.gz)(\.sha256)?$')"
          test "$count" -eq 6
          gh release edit v0.1.0 --repo "$GH_REPO" --draft=false --prerelease
