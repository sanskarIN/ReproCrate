name: Publish CLI and Desktop v0.5.0 prerelease (validated)

on:
  push:
    branches: [main]
    paths: [".release/v0.5.0"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --locked

  draft-release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create draft prerelease tied to reviewed source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.5.0 --json isDraft --jq .isDraft > /tmp/reprocrate-draft-state 2>/dev/null; then
            if [ "$(cat /tmp/reprocrate-draft-state)" != "true" ]; then
              echo "Refusing to overwrite an already published release" >&2
              exit 1
            fi
            echo "Reusing the existing unpublished draft for failed-job retry"
          else
            gh release create v0.5.0 --target "$GITHUB_SHA" --title "ReproCrate v0.5.0 (CLI pre-release)" --notes-file docs/releases/v0.5.0.md --prerelease --draft
          fi

  build-upload:
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile and smoke-test CLI
        run: |
          cargo +stable test --workspace --locked
          cargo +stable build -p reprocrate-cli --release --locked
      - name: Package Linux/macOS executable and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          package="reprocrate-v0.5.0-${os}-${arch}.tar.gz"
          tar -czf "$package" -C target/release reprocrate
          tar -tzf "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package" > "$package.sha256"
          else
            shasum -a 256 "$package" > "$package.sha256"
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Package Windows executable and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "AMD64") { "x86_64" } else { $env:PROCESSOR_ARCHITECTURE.ToLower() }
          $package = "reprocrate-v0.5.0-windows-$arch.zip"
          Compress-Archive -Path target/release/reprocrate.exe -DestinationPath $package
          Expand-Archive -Path $package -DestinationPath checked
          & "./checked/reprocrate.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $package).Hash.ToLower()
          "$hash  $package" | Set-Content -Path "$package.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE=$package"
      - name: Upload only real built package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f "$PACKAGE"
          test -f "$PACKAGE.sha256"
          gh release upload v0.5.0 "$PACKAGE" "$PACKAGE.sha256" --clobber

  desktop-upload:
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test and build frontend
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test Rust IPC and compile real desktop executable
        shell: bash
        run: |
          cargo +stable test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
          cd apps/desktop
          npm run desktop:build
      - name: Archive unsigned desktop binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          os="$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          package="reprocrate-desktop-v0.5.0-$os-$arch.tar.gz"
          test -s apps/desktop/src-tauri/target/release/reprocrate-desktop
          tar -czf "$package" -C apps/desktop/src-tauri/target/release reprocrate-desktop
          tar -tzf "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package" > "$package.sha256"
          else
            shasum -a 256 "$package" > "$package.sha256"
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Archive unsigned desktop exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/reprocrate-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Missing desktop binary" }
          if ((Get-Item $exe).Length -lt 1024) { throw "Invalid desktop binary" }
          $package = "reprocrate-desktop-v0.5.0-windows-x86_64.zip"
          Compress-Archive -Path $exe -DestinationPath $package
          Expand-Archive -Path $package -DestinationPath extracted-desktop
          if (-not (Test-Path extracted-desktop/reprocrate-desktop.exe)) { throw "Invalid desktop ZIP" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $package).Hash.ToLower()
          "$hash  $package" | Set-Content -Path "$package.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE=$package"
      - name: Upload native desktop archive with checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s "$PACKAGE"
          test -s "$PACKAGE.sha256"
          gh release upload v0.5.0 "$PACKAGE" "$PACKAGE.sha256" --repo "$GH_REPO" --clobber

  publish:
    needs: [build-upload, desktop-upload]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish only if every platform passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state="$(gh release view v0.5.0 --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          test "$state" = "true"
          names="$(gh release view v0.5.0 --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for suffix in linux-x86_64.tar.gz macos-arm64.tar.gz windows-x86_64.zip; do
            archive="reprocrate-v0.5.0-$suffix"
            printf '%s\n' "$names" | grep -Fx -- "$archive"
            printf '%s\n' "$names" | grep -Fx -- "$archive.sha256"
          done
          for suffix in linux-x86_64.tar.gz macos-arm64.tar.gz windows-x86_64.zip; do
            archive="reprocrate-desktop-v0.5.0-$suffix"
            printf '%s\n' "$names" | grep -Fx -- "$archive"
            printf '%s\n' "$names" | grep -Fx -- "$archive.sha256"
          done
          gh release edit v0.5.0 --repo "$GH_REPO" --draft=false --prerelease
