name: One-shot v0.5.0 desktop locks and icons

on:
  push:
    branches: [feat/v0.5.0-desktop-foundation]
    paths: [".setup/v0.5.0"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'sanskarIN/ReproCrate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/v0.5.0-desktop-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Lock frontend dependencies
        working-directory: apps/desktop
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Create native window icons from owned SVG
        working-directory: apps/desktop
        run: npm exec -- tauri icon public/reprocrate.svg
      - name: Resolve separate Tauri Rust lockfile
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated reproducibility files
        run: |
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in
          git add apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/icons
          if ! git diff --cached --quiet; then
            git commit -m "build(desktop): lock npm and Tauri dependencies; generate app icon assets"
            git push origin HEAD:feat/v0.5.0-desktop-foundation
          fi
