name: Refresh v0.9.1 Rust lockfiles (one-shot branch preparation)

on:
  push:
    branches: [feat/v0.9.1-zip-audit-hardening]
    paths:
      - ".github/workflows/v0.9.1-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/feat/v0.9.1-zip-audit-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Re-resolve both separately locked workspaces against patched ZIP
        run: |
          set -euo pipefail
          cargo +stable update --manifest-path Cargo.toml -p zip --precise 9.0.5
          cargo +stable update --manifest-path apps/desktop/src-tauri/Cargo.toml -p zip --precise 9.0.5
          python3 - <<'PY'
          import pathlib, tomllib
          for name in ("Cargo.lock", "apps/desktop/src-tauri/Cargo.lock"):
              data = tomllib.loads(pathlib.Path(name).read_text())
              zip_versions = [p["version"] for p in data["package"] if p["name"] == "zip"]
              if zip_versions != ["9.0.5"]:
                  raise SystemExit(f"{name}: unexpected zip package versions {zip_versions}")
              print(f"{name}: patched ZIP {zip_versions[0]} locked")
          PY
      - name: Commit regenerated lockfiles with requested author email
        run: |
          set -euo pipefail
          git config user.name "ReproCrate maintenance"
          git config user.email "sanskarin@outlook.in"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(lockfiles): lock patched zip 9.0.5 across CLI and desktop"
            for attempt in 1 2 3 4 5; do
              git fetch origin feat/v0.9.1-zip-audit-hardening
              git rebase origin/feat/v0.9.1-zip-audit-hardening
              if git push origin HEAD:feat/v0.9.1-zip-audit-hardening; then
                exit 0
              fi
              sleep 2
            done
            echo "Branch advanced repeatedly; refusing force push" >&2
            exit 1
          fi
