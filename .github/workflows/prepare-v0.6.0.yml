name: One-shot v0.6.0 lock and formatting
on:
  push:
    branches: [feat/v0.6.0-desktop-history]
    paths: [.setup/v0.6.0]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'sanskarIN/ReproCrate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/v0.6.0-desktop-history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Update versioned npm lock
        working-directory: apps/desktop
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Refresh native Rust dependencies and formatting
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo +stable fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Commit checked generation with maintainer identity
        run: |
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in
          git add apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m "build(v0.6): lock SQLite dependencies and format desktop history backend"
            git push origin HEAD:feat/v0.6.0-desktop-history
          fi
