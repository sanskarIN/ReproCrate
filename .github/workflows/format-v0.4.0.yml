name: One-shot v0.4.0 Rust format

on:
  push:
    branches: [feat/v0.4.0-compare-recipes]
    paths: [".format/v0.4.0"]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'sanskarIN/ReproCrate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/v0.4.0-compare-recipes
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all
      - name: Commit format-only changes
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add crates/reprocrate-core/src crates/reprocrate-cli/src crates/reprocrate-cli/tests
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): normalize v0.4.0 comparisons, recipes and tests"
            git push origin HEAD:feat/v0.4.0-compare-recipes
          fi
