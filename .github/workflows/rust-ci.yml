name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Compile workspace
        run: cargo +stable build --workspace --locked
      - name: Run tests
        run: cargo +stable test --workspace --locked
      - name: Lint
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Formatting
        run: cargo +stable fmt --all --check
