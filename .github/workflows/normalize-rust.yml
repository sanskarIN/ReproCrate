name: Normalize Rust workspace

on:
  push:
    branches: ["feat/v0.1.0-cli"]

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'sanskarIN/ReproCrate'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out development branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/v0.1.0-cli
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Generate lockfile and format Rust files
        run: |
          cargo +stable generate-lockfile
          cargo +stable fmt --all
      - name: Commit generated files if they changed
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add Cargo.lock crates/reprocrate-core/src crates/reprocrate-cli/src crates/reprocrate-cli/tests
          if ! git diff --cached --quiet; then
            git commit -m "style(build): format Rust sources and lock dependency versions"
            git push origin HEAD:feat/v0.1.0-cli
          fi
