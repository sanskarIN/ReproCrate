[workspace]
resolver = "2"
members = [
    "crates/reprocrate-core",
    "crates/reprocrate-cli",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "EPL-2.0"
repository = "https://github.com/sanskarIN/ReproCrate"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.10"
